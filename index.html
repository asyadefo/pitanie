<style>

button{font:inherit;color:inherit;background:var(--a2);border:0;border-radius:14px;padding:12px 16px;min-height:44px;cursor:pointer}

.in{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px))}

</style></head><body><main id="v"></main>

<div id="sh"></div><div id="ts"></div>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9),e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const MEALS=[['b','Завтрак'],['l','Обед'],['d','Ужин'],['s','Перекусы']],mealOf=()=>{const h=new Date().getHours();return h<11?'b':h<16?'l':h<21?'d':'s'};
const TIPS=['Регулярная еда обычно помогает с энергией в течение дня.','Разнообразие — это просто: разные овощи, крупы и источники белка в течение недели.','Перекус — такой же полноценный приём пищи.','Голод — просто сигнал поесть, без оценок.','Любая еда — просто еда. Записи нужны только для справки.'];
const KEY='pitanie-v1';let S,ok=true,V='today',D=today(),Q={},X,RC,ctx={m:'b'};
function seed(){const F=[['egg','Яйцо куриное',143,12.6,9.5,.7,'',0,1],['bread','Хлеб пшеничный',250,8,3,49,'',0,1],['veg','Овощи (смесь)',30,1.5,.3,5,'',0,1],['oil','Масло растительное',884,0,100,0,'',0,1],['oats','Овсяные хлопья',360,12,6,62,'сухие',0,0],['milk','Молоко 2,5%',52,2.8,2.5,4.7,'',0,1],['apple','Яблоко',52,.3,.2,14,'',0,0],['rice','Рис',345,7,.6,77,'сухой',2.8,1],['pasta','Макароны',350,12,1.5,71,'сухие',2.2,1],['cheese','Сыр твёрдый',350,25,27,0,'',0,1],['bulg','Булгур',340,12,1.3,63,'сухой',2.5,1],['pea','Горох колотый',310,21,1.5,50,'сухой',2.5,0],['pot','Картофель',77,2,.4,16,'',0,1],['yog','Греческий йогурт',100,9,5,4,'',0,0,'пример: у разных йогуртов значения разные — внеси с этикетки']];
const R=[['r1','Яичница с тостами и овощами','🍳',15,[['egg',105],['bread',70],['veg',125],['oil',5]],['Разогрей сковороду, добавь немного масла.','Приготовь яйца до желаемой степени.','Подай с хлебом и овощами.']],
['r2','Овсянка с яблоком','🍎',10,[['oats',60],['milk',225],['apple',125]],['Свари хлопья на молоке или воде по инструкции на упаковке.','Добавь нарезанное яблоко, корицу по желанию.']],
['r3','Рис с яйцом и овощами','🍚',25,[['rice',80],['egg',75],['veg',175],['oil',5]],['Свари рис (масса указана до варки).','Овощи потуши или быстро обжарь.','Добавь яйцо и готовый рис.']],
['r4','Макароны с сыром и овощами','🍝',15,[['pasta',80],['cheese',25],['veg',150]],['Отвари макароны (масса сухая).','Добавь овощи и сыр.']],
['r5','Булгур с яйцом и овощами','🥣',25,[['bulg',80],['egg',75],['veg',175]],['Свари булгур по инструкции (масса сухая).','Подай с яйцом и овощами.']],
['r6','Гороховая каша','🥘',45,[['pea',70],['veg',125],['oil',5]],['Промой горох.','Вари до мягкости — время зависит от вида и замачивания.','Добавь овощи. Бобовые должны быть хорошо проварены.']],
['r7','Картофель с яйцом и овощами','🥔',30,[['pot',250],['egg',75],['veg',125],['oil',5]],['Отвари или запеки картофель.','Подай с яйцом и овощами.']],
['r8','Греческий йогурт с яблоком','🍏',5,[['yog',175],['apple',125]],['Нарежь яблоко, добавь к йогурту, корицу по желанию.','Белок и калорийность йогурта возьми с этикетки своего продукта.']],
['r9','Бутерброд с сыром и яйцом','🥪',10,[['bread',70],['egg',50],['cheese',25]],['Свари яйцо или приготовь яичницу.','Собери бутерброд, овощи по желанию.']],
['r10','Чикен-бургер вне дома','🍔',0,[],['Добавь как «чикен-бургер, оценка» или внеси данные из меню заведения.','Точную калорийность без данных ресторана мы не угадываем. Следующий приём пищи — как обычно, без компенсаций.'],1],
['r11','Mac & Cheese','🧀',0,[],['Внеси данные с упаковки и свою порцию.','Можно добавить овощи, если хочется — это не обязательно.'],1],
['r12','Сладости и энергетики','🍫',0,[],['Сладости добавляются без оценок.','Для энергетика укажи объём и кофеин с этикетки — суммарный кофеин за день посчитается.','Учитывай кофеин и не пей энергетики поздно, если это мешает сну.'],1]];
return{foods:F.map(([id,n,k,p,f,c,st,ck,h,s])=>({id,n,k,p,f,c,st,ck,have:!!h,est:1,src:s||'пример: уточни по упаковке'})),recs:R.map(([id,n,em,t,ing,steps,free])=>({id,n,em,t,por:1,ing:ing.map(([f,g])=>({f,g})),steps,free})),log:[],shop:[],budget:500,weights:[],notes:[],water:{},set:{}}}
try{S=JSON.parse(localStorage.getItem(KEY))}catch(x){ok=false}
if(!S)S=seed();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(x){ok=false}}
const fd=id=>S.foods.find(f=>f.id==id),eff=x=>x.st=='c'&&x.ck?x.g/x.ck:x.g;
const tot=x=>{const g=eff(x);return{k:x.k*g/100,p:x.p*g/100,f:x.f*g/100,c:x.c*g/100}};
const sum=a=>a.reduce((s,x)=>{const t=tot(x);return{k:s.k+t.k,p:s.p+t.p,f:s.f+t.f,c:s.c+t.c,caf:s.caf+num(x.caf)}},{k:0,p:0,f:0,c:0,caf:0});
const rec=r=>{const t={k:0,p:0,f:0,c:0,g:0};r.ing.forEach(i=>{const f=fd(i.f);if(!f)return;t.k+=f.k*i.g/100;t.p+=f.p*i.g/100;t.f+=f.f*i.g/100;t.c+=f.c*i.g/100;t.g+=i.g});return t};
function toast(m){const t=$('#ts');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2200)}
function sheet(h){const s=$('#sh');s.innerHTML='<div class="in">'+h+'</div>';s.style.display='flex'}
const closeSh=()=>{$('#sh').style.display='none';$('#sh').innerHTML=''};
const row=x=>{const t=tot(x);return `<div class="c r sp" data-a="ed" data-i="${x.id}"><div><b>${e(x.n)}</b><div class="m">${x.g} г${x.ck?(x.st=='c'?' · готовый':' · до варки'):''}${x.caf?' · кофеин '+x.caf+' мг':''}</div></div><div class="m" style="text-align:right">${S.set.hc?'':'≈ '+r0(t.k)+' ккал'}</div></div>`};
const ms=a=>MEALS.map(([k,n])=>`<h2>${n.toUpperCase()}</h2>${a.filter(x=>x.m==k).map(row).join('')}<button class="g" data-a="add" data-i="${k}">+ добавить</button>`).join('');
const totBox=a=>{const t=sum(a);return (S.set.hc?'':`<div class="c"><div class="m">Справочно, примерно</div><div style="font-size:22px;font-weight:600">≈ ${r0(t.k)} ккал <span class="m" style="font-size:15px;font-weight:400">· белок ≈ ${r0(t.p)} г</span></div><div class="m">Ж ≈ ${r0(t.f)} г · У ≈ ${r0(t.c)} г</div></div>`)+(t.caf?`<div class="c m">Кофеин за день: ${r0(t.caf)} мг. Учитывай кофеин и не пей энергетики поздно, если это мешает сну.</div>`:'')};
function vToday(){const d=today(),a=S.log.filter(x=>x.d==d);return `<h1>Сегодня</h1><div class="m">${fmt(d)}</div><div class="c m">${TIPS[new Date().getDate()%TIPS.length]}</div>${totBox(a)}${S.set.ref?`<div class="m">Твой ориентир: ${S.set.ref} ккал — просто справка.</div>`:''}<button class="p" style="width:100%;margin-top:8px" data-a="add" data-i="${mealOf()}">+ Добавить еду</button>${ms(a)}<h2>ВОДА (ПО ЖЕЛАНИЮ)</h2><div class="c r sp"><button data-a="w" data-i="-1">−</button><div><b>${S.water[d]||0}</b> <span class="m">стаканов</span></div><button data-a="w" data-i="1">+</button></div>`}
function vDiary(){if(Q.an)return vAn();const a=S.log.filter(x=>x.d==D),days=[...new Set(S.log.map(x=>x.d))].sort().reverse().slice(0,30);return `<h1>Дневник</h1>${tg()}<div class="r"><button data-a="dd" data-i="-1">‹</button><input type="date" value="${D}" onchange="D=this.value||today();render()"><button data-a="dd" data-i="1">›</button></div>${totBox(a)}${ms(a)}<h2>ИСТОРИЯ</h2>${days.map(d=>{const s=sum(S.log.filter(x=>x.d==d));return `<div class="c r sp" data-a="go" data-i="${d}"><span>${fmt(d)}</span><span class="m">${S.set.hc?'':'≈ '+r0(s.k)+' ккал'}</span></div>`}).join('')||'<div class="m">Записей пока нет</div>'}`}
const tg=()=>`<div class="r" style="margin:6px 0"><button class="${Q.an?'':'p'}" data-a="an" data-i="0">День</button><button class="${Q.an?'p':''}" data-a="an" data-i="1">Анализ</button></div>`;
function bars(a,u){const W=320,H=110,m=Math.max(...a.map(x=>x.v),1),w=W/a.length;return `<svg viewBox="0 0 ${W} ${H+16}" style="width:100%">${a.map((x,i)=>`<rect x="${i*w+1}" y="${H-H*x.v/m}" width="${Math.max(w-2,1)}" height="${H*x.v/m}" rx="2" fill="var(--a)" opacity="${x.v?1:.2}"/>`).join('')}<g font-size="10" fill="var(--m)"><text x="0" y="${H+13}">${fmtS(a[0].d)}</text><text x="${W}" y="${H+13}" text-anchor="end">${fmtS(a[a.length-1].d)}</text></g></svg><div class="m">максимум на графике ≈ ${r0(m)} ${u}</div>`}
function vAn(){const n=Q.pd||14,ds=[];for(let i=n-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);ds.push(ymd(d))}
const per=ds.map(d=>{const a=S.log.filter(x=>x.d==d),s=sum(a);return{d,a,...s,v:s.k}}),full=per.filter(x=>x.a.length),nd=full.length,av=k=>nd?full.reduce((s,x)=>s+x[k],0)/nd:0;
const all=full.flatMap(x=>x.a),T=sum(all),mk=4*T.p+9*T.f+4*T.c,sh=v=>mk?r0(v/mk*100):0,cnt={};all.forEach(x=>cnt[x.n]=(cnt[x.n]||0)+1);
const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,5),byM=MEALS.map(([k,nm])=>[nm,sum(all.filter(x=>x.m==k)).k]);
return `<h1>Анализ</h1>${tg()}<div class="r" style="margin-bottom:6px">${[7,14,30].map(p=>`<button class="${n==p?'p':''}" data-a="pd" data-i="${p}">${p} дн.</button>`).join('')}</div><div class="c m">Это справка, а не оценка. Учитываются только дни с записями (${nd} из ${n}); калорийность приблизительная.</div>${nd?(S.set.hc?'':`<h2>В СРЕДНЕМ ЗА ДЕНЬ</h2><div class="c"><div style="font-size:22px;font-weight:600">≈ ${r0(av('k'))} ккал</div><div class="m">Белки ≈ ${r0(av('p'))} г · Жиры ≈ ${r0(av('f'))} г · Углеводы ≈ ${r0(av('c'))} г</div></div><h2>КАЛОРИИ ПО ДНЯМ</h2><div class="c">${bars(per.map(x=>({d:x.d,v:x.k})),'ккал')}</div><h2>БЕЛОК ПО ДНЯМ</h2><div class="c">${bars(per.map(x=>({d:x.d,v:x.p})),'г')}</div><h2>ИЗ ЧЕГО СОСТОИТ ЭНЕРГИЯ</h2><div class="c"><div style="display:flex;height:16px;border-radius:8px;overflow:hidden"><div style="flex:${sh(4*T.p)||.01};background:var(--a)"></div><div style="flex:${sh(9*T.f)||.01};background:var(--a);opacity:.6"></div><div style="flex:${sh(4*T.c)||.01};background:var(--a);opacity:.3"></div></div><div class="m" style="margin-top:6px">Белки ${sh(4*T.p)}% · Жиры ${sh(9*T.f)}% · Углеводы ${sh(4*T.c)}% (по 4/9/4 ккал на грамм)</div></div><h2>ПО ПРИЁМАМ ПИЩИ</h2><div class="c">${byM.map(([nm,k])=>`<div class="r sp"><span>${nm}</span><span class="m">${T.k?r0(k/T.k*100):0}%</span></div>`).join('')}</div>`)+`<h2>РЕГУЛЯРНОСТЬ</h2><div class="c">Приёмов пищи в день в среднем: ${r1(full.reduce((s,x)=>s+new Set(x.a.map(y=>y.m)).size,0)/nd)} (по записям).</div><h2>ЧАЩЕ ВСЕГО</h2><div class="c">${top.map(([k,v])=>`<div class="r sp"><span>${e(k)}</span><span class="m">${v}×</span></div>`).join('')}</div>${T.caf?`<h2>КОФЕИН</h2><div class="c">В среднем ≈ ${r0(av('caf'))} мг в день.</div>`:''}`:'<div class="c m">За этот период записей пока нет.</div>'}<h2>ВЕС</h2>${S.set.hw?'<div class="c m">Вес скрыт в профиле.</div>':`<div class="c">${chart()}</div>`}`}
const lsRec=()=>{const q=(Q.r||'').toLowerCase();return S.recs.filter(r=>r.n.toLowerCase().includes(q)&&(!Q.fav||r.fav)).map(r=>{const t=rec(r),k=t.g?r0(t.k/(r.por||1)):0;return `<div class="c r" data-a="rd" data-i="${r.id}"><div class="ph">${r.em}</div><div style="flex:1"><b>${e(r.n)}</b><div class="m">${r.free?'внеси данные с упаковки или из меню':(r.t?r.t+' мин':'')+(k&&!S.set.hc?' · ≈ '+k+' ккал (оценка)':'')}</div></div>${r.fav?'♥':''}</div>`}).join('')||'<div class="m">Ничего не найдено</div>'};
